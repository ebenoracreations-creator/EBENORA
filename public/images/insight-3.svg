    <linearGradient id="penGrad" x1="420" y1="60" x2="170" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <path d="M100 310 Q200 290 350 320 T500 300" stroke="#FF8A00" stroke-width="4" fill="none"/>
